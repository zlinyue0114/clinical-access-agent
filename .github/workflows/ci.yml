name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commits; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: make check
      - name: Sample data is reproducible
        run: |
          make data-sample
          git diff --exit-code -- data/sample
      - name: Evaluation meets the success criteria and matches committed results
        run: |
          make eval
          git diff --exit-code -- results/scripted
