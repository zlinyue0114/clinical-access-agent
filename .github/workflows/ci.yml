name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commits; Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: make check
      - name: Sample data is reproducible
        run: |
          make data-sample
          git diff --exit-code -- data/sample
      - name: Evaluation meets the success criteria and matches committed results
        run: |
          make eval
          git diff --exit-code -- results/scripted
