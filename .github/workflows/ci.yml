name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: make check
      - name: Sample data is reproducible
        run: |
          make data-sample
          git diff --exit-code -- data/sample
      - name: Evaluation meets the success criteria and matches committed results
        run: |
          make eval
          git diff --exit-code -- results/scripted
